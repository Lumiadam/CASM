services:
  postgres:
    image: postgres:16-alpine
    container_name: casms-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-casms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-casms_secret}
      POSTGRES_DB: ${POSTGRES_DB:-casms}
    volumes:
      - casms_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-casms} -d ${POSTGRES_DB:-casms}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - casms-net

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    container_name: casms-backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://casms:casms_secret@postgres:5432/casms}
      SECRET_KEY: ${SECRET_KEY:-casms-dev-secret-change-in-production}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - casms-net

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    container_name: casms-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    depends_on:
      - backend
    networks:
      - casms-net

  nginx:
    image: nginx:1.27-alpine
    container_name: casms-nginx
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - casms-net

volumes:
  casms_pg_data:

networks:
  casms-net:
    driver: bridge
